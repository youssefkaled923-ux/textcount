<header class="sticky top-0 z-50 bg-base-dark/90 backdrop-blur border-b border-border-dark">

    <div class="flex items-center gap-2">

</header>

<main class="flex-1 w-full max-w-4xl mx-auto px-4 md:px-8 py-10 md:py-14">

  <div class="text-center mb-8">
    <h1 id="heading" data-i18n="heading" class="text-3xl md:text-5xl font-extrabold tracking-tight text-slate-50 mb-3"></h1>
    <p data-i18n="subheading" class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto"></p>
  </div>

  <div class="bg-card-dark border border-border-dark rounded-2xl p-2 mb-4 focus-within:ring-2 focus-within:ring-accent-sky transition">
    <textarea id="text-input" rows="8" spellcheck="false" class="w-full bg-transparent resize-y outline-none p-4 text-slate-100 placeholder-slate-500 text-base md:text-lg leading-relaxed"></textarea>
  </div>

  <!-- Quick Text Actions (إجراءات التنظيف السريع) -->
  <div class="flex flex-wrap gap-2 mb-6">
    <button id="btn-clean-spaces" data-i18n="cleanSpacesBtn" class="text-xs bg-base-dark border border-border-dark px-3 py-1.5 rounded-md hover:border-accent-sky text-slate-300 hover:text-white transition">✨ Clean Extra Spaces</button>
    <button id="btn-uppercase" data-i18n="uppercaseBtn" class="text-xs bg-base-dark border border-border-dark px-3 py-1.5 rounded-md hover:border-accent-sky text-slate-300 hover:text-white transition">UPPERCASE</button>
    <button id="btn-lowercase" data-i18n="lowercaseBtn" class="text-xs bg-base-dark border border-border-dark px-3 py-1.5 rounded-md hover:border-accent-sky text-slate-300 hover:text-white transition">lowercase</button>
    <button id="btn-titlecase" data-i18n="titlecaseBtn" class="text-xs bg-base-dark border border-border-dark px-3 py-1.5 rounded-md hover:border-accent-sky text-slate-300 hover:text-white transition">Title Case</button>
  </div>

  <!-- Main Action Buttons -->
  <div class="flex flex-wrap gap-3 justify-center mb-10">
    <button id="copy-btn" type="button" class="inline-flex items-center gap-2 bg-accent-sky text-base-dark font-semibold px-5 py-2.5 rounded-lg hover:brightness-110 active:scale-95 transition">
      <span id="copy-btn-label" data-i18n="copyBtn">Copy Text</span>
    </button>
    <button id="clear-btn" type="button" class="inline-flex items-center gap-2 bg-card-dark border border-border-dark text-slate-200 font-semibold px-5 py-2.5 rounded-lg hover:border-red-500 hover:text-red-400 active:scale-95 transition">
      <span data-i18n="clearBtn">Clear All</span>
    </button>
  </div>

  <!-- Counters Grid -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-card-dark border border-border-dark rounded-xl p-5 text-center">
      <p id="stat-chars-with-spaces" class="font-mono-nums text-3xl font-bold text-accent-sky mb-1">0</p>
      <p data-i18n="statCharsWithSpaces" class="text-slate-400 text-xs"></p>
    </div>
    <div class="bg-card-dark border border-border-dark rounded-xl p-5 text-center">
      <p id="stat-chars-no-spaces" class="font-mono-nums text-3xl font-bold text-accent-sky mb-1">0</p>
      <p data-i18n="statCharsNoSpaces" class="text-slate-400 text-xs"></p>
    </div>
    <div class="bg-card-dark border border-border-dark rounded-xl p-5 text-center">
      <p id="stat-words" class="font-mono-nums text-3xl font-bold text-accent-sky mb-1">0</p>
      <p data-i18n="statWords" class="text-slate-400 text-xs"></p>
    </div>
    <div class="bg-card-dark border border-border-dark rounded-xl p-5 text-center">
      <p id="stat-lines" class="font-mono-nums text-3xl font-bold text-accent-sky mb-1">0</p>
      <p data-i18n="statLines" class="text-slate-400 text-xs"></p>
    </div>
  </div>

  <!-- Reading & Speaking Time -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
    <div class="bg-card-dark border border-border-dark rounded-xl p-4 flex items-center justify-between">
      <span data-i18n="readingTimeLabel" class="text-sm font-medium text-slate-300">⏱️ Reading Time (200 wpm):</span>
      <span id="reading-time" class="font-mono-nums font-bold text-accent-sky text-sm">0 sec</span>
    </div>
    <div class="bg-card-dark border border-border-dark rounded-xl p-4 flex items-center justify-between">
      <span data-i18n="speakingTimeLabel" class="text-sm font-medium text-slate-300">🎙️ Speaking Time (130 wpm):</span>
      <span id="speaking-time" class="font-mono-nums font-bold text-accent-sky text-sm">0 sec</span>
    </div>
  </div>

  <!-- Top Keywords Density (International SEO Enabled) -->
  <div class="bg-card-dark border border-border-dark rounded-2xl p-6 mb-10">
    <h3 data-i18n="keywordDensityTitle" class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2">
      📊 Top Keyword Density
    </h3>
    <div id="keywords-list" class="space-y-3">
      <p data-i18n="keywordPrompt" class="text-slate-500 text-sm">Start typing to see keyword density analysis...</p>
    </div>
  </div>

  <!-- Platform Limits -->
  <h2 data-i18n="limitsTitle" class="text-xl font-bold text-slate-100 mb-4"></h2>
  <div class="bg-card-dark border border-border-dark rounded-2xl p-6 space-y-6 mb-10">
    <div>
      <div class="flex justify-between items-center mb-2 gap-3">
        <span data-i18n="limitGoogleTitle" class="text-sm font-medium text-slate-300"></span>
        <span id="count-googleTitle" class="font-mono-nums text-sm text-accent-sky">0 / 60</span>
      </div>
      <div class="w-full h-2 bg-base-dark rounded-full overflow-hidden border border-border-dark">
        <div id="bar-googleTitle" class="h-full bg-accent-sky transition-all duration-300" style="width:0%"></div>
      </div>
    </div>
    <div>
      <div class="flex justify-between items-center mb-2 gap-3">
        <span data-i18n="limitGoogleDesc" class="text-sm font-medium text-slate-300"></span>
        <span id="count-googleDesc" class="font-mono-nums text-sm text-accent-sky">0 / 160</span>
      </div>
      <div class="w-full h-2 bg-base-dark rounded-full overflow-hidden border border-border-dark">
        <div id="bar-googleDesc" class="h-full bg-accent-sky transition-all duration-300" style="width:0%"></div>
      </div>
    </div>
    <div>
      <div class="flex justify-between items-center mb-2 gap-3">
        <span data-i18n="limitX" class="text-sm font-medium text-slate-300"></span>
        <span id="count-xPost" class="font-mono-nums text-sm text-accent-sky">0 / 280</span>
      </div>
      <div class="w-full h-2 bg-base-dark rounded-full overflow-hidden border border-border-dark">
        <div id="bar-xPost" class="h-full bg-accent-sky transition-all duration-300" style="width:0%"></div>
      </div>
    </div>
    <div>
      <div class="flex justify-between items-center mb-2 gap-3">
        <span data-i18n="limitTikTok" class="text-sm font-medium text-slate-300"></span>
        <span id="count-tiktok" class="font-mono-nums text-sm text-accent-sky">0 / 2200</span>
      </div>
      <div class="w-full h-2 bg-base-dark rounded-full overflow-hidden border border-border-dark">
        <div id="bar-tiktok" class="h-full bg-accent-sky transition-all duration-300" style="width:0%"></div>
      </div>
    </div>
  </div>

</main>

  var textInput = document.getElementById("text-input");
  var langSelect = document.getElementById("lang-select");

  function getLang() {
    var params = new URLSearchParams(window.location.search);
    var urlLang = params.get("lang");
    if (urlLang && translations[urlLang]) return urlLang;
    var navLang = (navigator.language || "").slice(0, 2).toLowerCase();
    if (translations[navLang]) return navLang;
    return "en";
  }

  function setLanguage(lang) {
    var data = translations[lang] || translations.en;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === "ar" || lang === "ur") ? "rtl" : "ltr";
    
    document.title = (data.heading || "Character & Word Counter") + " | TextCount.net";
    textInput.placeholder = data.placeholder;

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (data[key]) el.textContent = data[key];
    });

    langSelect.value = lang;
    updateStats();
  }

  function formatTime(seconds, lang) {
    var data = translations[lang] || translations.en;
    if (seconds < 60) return seconds + " " + data.unitSec;
    var mins = Math.floor(seconds / 60);
    var secs = seconds % 60;
    return mins + " " + data.unitMin + (secs > 0 ? " " + secs + " " + data.unitSec : "");
  }

  function updateStats() {
    var currentLang = langSelect.value;
    var text = textInput.value;
    var charsWith = text.length;
    var charsNo = text.replace(/\s/g, "").length;
    var wordsArr = text.trim() === "" ? [] : text.trim().split(/\s+/);
    var words = wordsArr.length;
    var lines = text === "" ? 0 : text.split(/\r\n|\r|\n/).length;

    document.getElementById("stat-chars-with-spaces").textContent = charsWith.toLocaleString();
    document.getElementById("stat-chars-no-spaces").textContent = charsNo.toLocaleString();
    document.getElementById("stat-words").textContent = words.toLocaleString();
    document.getElementById("stat-lines").textContent = lines.toLocaleString();

    // Reading & Speaking Time Calculation
    var readSecs = Math.ceil((words / 200) * 60);
    var speakSecs = Math.ceil((words / 130) * 60);
    document.getElementById("reading-time").textContent = formatTime(readSecs, currentLang);
    document.getElementById("speaking-time").textContent = formatTime(speakSecs, currentLang);

    // International SEO Keyword Density Filter
    updateKeywordDensity(wordsArr, currentLang);

    // Platform Limits Progress Bars
    updateLimit("googleTitle", charsWith, 60);
    updateLimit("googleDesc", charsWith, 160);
    updateLimit("xPost", charsWith, 280);
    updateLimit("tiktok", charsWith, 2200);
  }

  function updateKeywordDensity(wordsArr, currentLang) {
    var listEl = document.getElementById("keywords-list");
    var data = translations[currentLang] || translations.en;

    if (wordsArr.length === 0) {
      listEl.innerHTML = '<p class="text-slate-500 text-sm">' + data.keywordPrompt + '</p>';
      return;
    }

    var freq = {};
    var stops = stopWordsDb[currentLang] || stopWordsDb.en;

    wordsArr.forEach(function(w) {
      var clean = w.toLowerCase().replace(/[^\w\u0600-\u06FF\u0750-\u077F\u0900-\u097F\u0980-\u09FF\u3040-\u30FF\u4E00-\u9FFF]/g, "");
      if (clean.length > 1 && !stops.includes(clean)) {
        freq[clean] = (freq[clean] || 0) + 1;
      }
    });

    var sorted = Object.keys(freq).map(function(key) {
      return [key, freq[key]];
    }).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 5);

    if (sorted.length === 0) {
      listEl.innerHTML = '<p class="text-slate-500 text-sm">' + data.noKeywordsFound + '</p>';
      return;
    }

    var html = "";
    sorted.forEach(function(item) {
      var pct = ((item[1] / wordsArr.length) * 100).toFixed(1);
      html += '<div class="flex items-center justify-between text-sm">' +
        '<span class="font-medium text-slate-200">' + item[0] + '</span>' +
        '<div class="flex items-center gap-3">' +
          '<span class="text-xs text-slate-400 font-mono-nums">' + item[1] + ' (' + pct + '%)</span>' +
          '<div class="w-24 h-1.5 bg-base-dark rounded-full overflow-hidden border border-border-dark">' +
            '<div class="h-full bg-accent-sky" style="width:' + Math.min(pct * 5, 100) + '%"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    });
    listEl.innerHTML = html;
  }

  function updateLimit(id, val, max) {
    var countEl = document.getElementById("count-" + id);
    var barEl = document.getElementById("bar-" + id);
    countEl.textContent = val + " / " + max;
    var pct = Math.min((val / max) * 100, 100);
    barEl.style.width = pct + "%";
    barEl.className = val > max ? "h-full bg-red-500 transition-all duration-300" : "h-full bg-accent-sky transition-all duration-300";
  }

  // Quick Text Actions Events
  document.getElementById("btn-clean-spaces").addEventListener("click", function() {
    textInput.value = textInput.value.replace(/\s+/g, ' ').trim();
    updateStats();
  });
  document.getElementById("btn-uppercase").addEventListener("click", function() {
    textInput.value = textInput.value.toUpperCase();
    updateStats();
  });
  document.getElementById("btn-lowercase").addEventListener("click", function() {
    textInput.value = textInput.value.toLowerCase();
    updateStats();
  });
  document.getElementById("btn-titlecase").addEventListener("click", function() {
    textInput.value = textInput.value.replace(/\w\S*/g, function(txt){return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();});
    updateStats();
  });

  document.getElementById("clear-btn").addEventListener("click", function () {
    textInput.value = "";
    updateStats();
  });

  document.getElementById("copy-btn").addEventListener("click", function () {
    if(!textInput.value) return;
    navigator.clipboard.writeText(textInput.value).then(function() {
      var label = document.getElementById("copy-btn-label");
      var original = label.textContent;
      var currentLang = langSelect.value;
      label.textContent = (translations[currentLang] || translations.en).copiedBtn;
      setTimeout(function() { label.textContent = original; }, 2000);
    });
  });

  langSelect.addEventListener("change", function () {
    var lang = this.value;
    var url = new URL(window.location);
    url.searchParams.set("lang", lang);
    window.history.pushState({}, "", url);
    setLanguage(lang);
  });

  textInput.addEventListener("input", updateStats);

  // App Initialization
  var initLang = getLang();
  setLanguage(initLang);

})();
</script>
