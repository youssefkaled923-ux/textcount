  var rtlLangs = ["ar", "ur"];
  var fontClassMap = {
    ar: "font-arabic", ur: "font-arabic",
    zh: "font-zh", ja: "font-ja", hi: "font-hi", bn: "font-bn"
  };
  var allFontClasses = ["font-latin", "font-arabic", "font-zh", "font-ja", "font-hi", "font-bn"];
  var localeMap = {
    ar: "ar_AR", en: "en_US", de: "de_DE", fr: "fr_FR", es: "es_ES",
    it: "it_IT", nl: "nl_NL", tr: "tr_TR", pt: "pt_PT", ru: "ru_RU",
    zh: "zh_CN", ja: "ja_JP", hi: "hi_IN", bn: "bn_BD", ur: "ur_PK"
  };
  var hreflangCodes = ["ar", "en", "de", "fr", "es", "it", "nl", "tr", "pt", "ru", "zh", "ja", "hi", "bn", "ur"];

  var currentLang = "en";

  var langSelect = document.getElementById("lang-select");
  var textInput = document.getElementById("text-input");
  var copyBtn = document.getElementById("copy-btn");
  var copyBtnLabel = document.getElementById("copy-btn-label");
  var clearBtn = document.getElementById("clear-btn");

  var metaDescriptionTag = document.getElementById("meta-description");
  var metaKeywordsTag = document.getElementById("meta-keywords");
  var canonicalTag = document.getElementById("canonical-link");
  var ogTitleTag = document.getElementById("og-title");
  var ogDescTag = document.getElementById("og-description");
  var ogUrlTag = document.getElementById("og-url");
  var ogLocaleTag = document.getElementById("og-locale");
  var twitterTitleTag = document.getElementById("twitter-title");
  var twitterDescTag = document.getElementById("twitter-description");

  var statCharsWithSpaces = document.getElementById("stat-chars-with-spaces");
  var statCharsNoSpaces = document.getElementById("stat-chars-no-spaces");
  var statWords = document.getElementById("stat-words");
  var statLines = document.getElementById("stat-lines");

  var limitConfigs = [
    { key: "googleTitle", limit: 60 },
    { key: "googleDesc", limit: 160 },
    { key: "xPost", limit: 280 },
    { key: "tiktok", limit: 2200 }
  ];

  function buildBaseUrl() {
    return window.location.origin + window.location.pathname;
  }

  function injectHreflangTags() {
    var base = buildBaseUrl();
    var head = document.head;
    hreflangCodes.forEach(function (code) {
      var link = document.createElement("link");
      link.setAttribute("rel", "alternate");
      link.setAttribute("hreflang", code);
      link.setAttribute("href", base + "?lang=" + code);
      head.appendChild(link);
    });
    var defaultLink = document.createElement("link");
    defaultLink.setAttribute("rel", "alternate");
    defaultLink.setAttribute("hreflang", "x-default");
    defaultLink.setAttribute("href", base);
    head.appendChild(defaultLink);
  }

  function setLanguage(lang) {
    if (!translations[lang]) { lang = "en"; }
    currentLang = lang;
    var t = translations[lang];
    var isRtl = rtlLangs.indexOf(lang) !== -1;

    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", isRtl ? "rtl" : "ltr");

    document.title = t.title;
    metaDescriptionTag.setAttribute("content", t.metaDescription);
    metaKeywordsTag.setAttribute("content", t.metaKeywords);
    ogTitleTag.setAttribute("content", t.title);
    ogDescTag.setAttribute("content", t.metaDescription);
    ogUrlTag.setAttribute("content", buildBaseUrl() + "?lang=" + lang);
    ogLocaleTag.setAttribute("content", localeMap[lang] || "en_US");
    twitterTitleTag.setAttribute("content", t.title);
    twitterDescTag.setAttribute("content", t.metaDescription);
    canonicalTag.setAttribute("href", buildBaseUrl() + "?lang=" + lang);

    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      var key = nodes[i].getAttribute("data-i18n");
      if (t[key] !== undefined) { nodes[i].textContent = t[key]; }
    }

    textInput.setAttribute("placeholder", t.placeholder);
    langSelect.value = lang;

    document.body.classList.remove.apply(document.body.classList, allFontClasses);
    document.body.classList.add(fontClassMap[lang] || "font-latin");

    try { localStorage.setItem("textcount_lang", lang); } catch (e) { /* storage unavailable */ }
  }

  function countGraphemes(str) {
    return Array.from(str).length;
  }

  function updateLimitBar(key, value, limit) {
    var bar = document.getElementById("bar-" + key);
    var countEl = document.getElementById("count-" + key);
    var percent = Math.min(100, (value / limit) * 100);
    bar.style.width = percent + "%";
    countEl.textContent = value + " / " + limit;
    if (value > limit) {
      bar.style.backgroundColor = "#ef4444";
      countEl.classList.remove("text-accent-sky");
      countEl.classList.add("text-red-500");
    } else {
      bar.style.backgroundColor = "#38bdf8";
      countEl.classList.remove("text-red-500");
      countEl.classList.add("text-accent-sky");
    }
  }

  function updateStats() {
    var text = textInput.value;
    var withSpaces = countGraphemes(text);
    var noSpaces = countGraphemes(text.replace(/\s/g, ""));
    var trimmed = text.trim();
    var words = trimmed.length === 0 ? 0 : trimmed.split(/\s+/).length;
    var lines = text.length === 0 ? 0 : text.split(/\n/).length;

    statCharsWithSpaces.textContent = withSpaces;
    statCharsNoSpaces.textContent = noSpaces;
    statWords.textContent = words;
    statLines.textContent = lines;

    limitConfigs.forEach(function (cfg) {
      updateLimitBar(cfg.key, withSpaces, cfg.limit);
    });
  }

  function detectInitialLang() {
    var params = new URLSearchParams(window.location.search);
    var paramLang = params.get("lang");
    if (paramLang && translations[paramLang]) { return paramLang; }

    try {
      var saved = localStorage.getItem("textcount_lang");
      if (saved && translations[saved]) { return saved; }
    } catch (e) { /* storage unavailable */ }

    var browserLang = ((navigator.language || navigator.userLanguage || "en").split("-")[0] || "en").toLowerCase();
    if (translations[browserLang]) { return browserLang; }

    return "en";
  }

  copyBtn.addEventListener("click", function () {
    if (!textInput.value) { return; }
    var restore = function () {
      copyBtnLabel.textContent = translations[currentLang].copyBtn;
    };
    var showCopied = function () {
      copyBtnLabel.textContent = translations[currentLang].copiedBtn;
      setTimeout(restore, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textInput.value).then(showCopied, function () {
        textInput.select();
        document.execCommand("copy");
        showCopied();
      });
    } else {
      textInput.select();
      document.execCommand("copy");
      showCopied();
    }
  });

  clearBtn.addEventListener("click", function () {
    textInput.value = "";
    updateStats();
    textInput.focus();
  });

  textInput.addEventListener("input", updateStats);
  langSelect.addEventListener("change", function (e) {
    setLanguage(e.target.value);
  });

  injectHreflangTags();
  setLanguage(detectInitialLang());
  updateStats();
