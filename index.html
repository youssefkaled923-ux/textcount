<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextCount.net - Free Word & Character Counter Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 'base-dark': '#0f172a', 'card-dark': '#1e293b', 'border-dark': '#334155', 'accent-sky': '#38bdf8' }
        }
      }
    };
  </script>
</head>
<body class="bg-base-dark text-slate-100 min-h-screen flex flex-col justify-between font-sans">
  <!-- Header -->
  <header class="border-b border-border-dark py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <a href="/" class="text-xl font-bold text-slate-50">TextCount<span class="text-accent-sky">.net</span></a>
      <a href="/blog.html" class="text-sm text-accent-sky hover:underline">Blog</a>
    </div>
  </header>

  <!-- Main Content / Main Tool Container -->
  <main class="max-w-4xl mx-auto px-4 py-10 flex-1 w-full">
    <div class="text-center mb-8">
      <h1 class="text-3xl md:text-4xl font-bold text-slate-50 mb-3">Real-Time Word & Character Counter</h1>
      <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">Analyze your text metrics, estimate reading and speech duration, and optimize content for SEO & social media limits instantly.</p>
    </div>

    <!-- Live Counter Card -->
    <div class="bg-card-dark border border-border-dark rounded-xl p-6 shadow-xl mb-8">
      <textarea 
        id="text-input" 
        rows="8" 
        placeholder="Type or paste your content here..." 
        class="w-full bg-base-dark text-slate-100 placeholder-slate-500 border border-border-dark rounded-lg p-4 focus:outline-none focus:border-accent-sky transition resize-y text-base mb-6"
      ></textarea>

      <!-- Counter Metrics Grid -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
        <div class="bg-base-dark p-4 rounded-lg border border-border-dark">
          <span class="block text-2xl font-bold text-accent-sky" id="word-count">0</span>
          <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Words</span>
        </div>
        <div class="bg-base-dark p-4 rounded-lg border border-border-dark">
          <span class="block text-2xl font-bold text-accent-sky" id="char-count">0</span>
          <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Characters</span>
        </div>
        <div class="bg-base-dark p-4 rounded-lg border border-border-dark">
          <span class="block text-2xl font-bold text-accent-sky" id="reading-time">0m</span>
          <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Reading Time</span>
        </div>
        <div class="bg-base-dark p-4 rounded-lg border border-border-dark">
          <span class="block text-2xl font-bold text-accent-sky" id="speaking-time">0m</span>
          <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Speaking Time</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-border-dark py-6 text-center text-slate-500 text-xs">
    <p>© 2026 TextCount.net — All rights reserved</p>
  </footer>

  <!-- Basic Counter Script -->
  <script>
    const textInput = document.getElementById('text-input');
    const wordCountEl = document.getElementById('word-count');
    const charCountEl = document.getElementById('char-count');
    const readingTimeEl = document.getElementById('reading-time');
    const speakingTimeEl = document.getElementById('speaking-time');

    textInput.addEventListener('input', () => {
      const text = textInput.value;
      const characters = text.length;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      
      // Average reading speed: 200 wpm, speaking speed: 130 wpm
      const readMins = Math.ceil(words / 200);
      const speakMins = Math.ceil(words / 130);

      charCountEl.textContent = characters;
      wordCountEl.textContent = words;
      readingTimeEl.textContent = `${words > 0 ? readMins : 0}m`;
      speakingTimeEl.textContent = `${words > 0 ? speakMins : 0}m`;
    });
  </script>
</body>
</html>
